<app-header></app-header>

<header class="header">
  <div class="container header-content">
    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a class="active" href="#">Contact</a>
    </nav>
  </div>
</header>

<main class="main">
  <div class="container">
    <!-- HERO -->
    <div class="hero">
      <span class="pill">Get In Touch</span>
      <h2>Let’s Talk About Your Order</h2>
      <p>Premium dry meat. Authentic taste. Reach out for orders or bulk pricing.</p>
    </div>

    <div class="grid">
      <div>
        <div class="card">
          <div class="icon">📞</div>
          <div>
            <strong>Phone</strong>
            <p>+91 XXXXX XXXXX</p>
          </div>
        </div>

        <div class="card">
          <div class="icon">✉️</div>
          <div>
            <strong>Email</strong>
            <p>hello@desidryment.in</p>
          </div>
        </div>

        <div class="card">
          <div class="icon">📍</div>
          <div>
            <strong>Location</strong>
            <p>Hyderabad, India</p>
          </div>
        </div>

        <div class="card">
          <div class="icon">⏰</div>
          <div>
            <strong>Hours</strong>
            <p>Mon–Sat, 9AM–7PM</p>
          </div>
        </div>
      </div>

      <!-- FORM -->
      <div class="form-card">
        <form>
          <div class="row">
            <input type="text" placeholder="Full Name" required />
            <input type="tel" placeholder="Phone Number" />
          </div>

          <div class="row">
            <input type="email" placeholder="Email Address" required />
            <select>
              <option>Order</option>
              <option>Bulk Order</option>
              <option>Product Query</option>
            </select>
          </div>

          <textarea placeholder="Your Message"></textarea>

          <button type="submit">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</main>
